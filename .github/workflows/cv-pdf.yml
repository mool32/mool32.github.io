name: cv-pdf

# Keeps /cv.pdf in sync with the /cv/ page by rendering the built page itself.
# The PDF is therefore the page — it cannot drift from the CV content.
#
# Runs only when the CV or its presentation changes (note: `cv.pdf` is NOT in the
# paths filter, so the commit this job makes cannot retrigger it).

on:
  push:
    branches: [main]
    paths:
      - "cv.md"
      - "assets/css/style.css"
      - "_includes/**"
      - "_layouts/**"
      - ".github/workflows/cv-pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Install Jekyll + the plugins used in _config.yml
        run: gem install --no-document jekyll jekyll-feed jekyll-sitemap jekyll-seo-tag

      - name: Build the site
        run: jekyll build

      - name: Render /cv/ to PDF with headless Chrome
        run: |
          # Serve over http:// — the site uses root-absolute asset paths, which
          # would not resolve under file://, and the PDF would come out unstyled.
          python3 -m http.server 4000 --directory _site &
          for i in $(seq 1 20); do curl -sf http://localhost:4000/cv/ >/dev/null && break; sleep 1; done
          google-chrome --headless=new --disable-gpu --no-sandbox \
            --no-pdf-header-footer \
            --print-to-pdf=cv.pdf \
            http://localhost:4000/cv/
          ls -la cv.pdf

      - name: Commit the regenerated PDF if it changed
        run: |
          if git diff --quiet -- cv.pdf; then
            echo "cv.pdf unchanged — nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cv.pdf
          git commit -m "Rebuild cv.pdf from the /cv/ page [skip ci]"
          git push
